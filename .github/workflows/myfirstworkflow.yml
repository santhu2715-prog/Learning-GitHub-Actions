
name: myfirstworkflow

# Trigger workflow on every push
on: push

jobs:
  job1:
    name: JOB1
    runs-on: windows-latest

    steps:
      - name: Running my first workflow
        run: echo "This is my first command"
        shell: pwsh
        run: get-computerinfo

      - name: Checking OS release
        run: cat /etc/os-release

  job2:
    name: JOB2
    runs-on: ubuntu-latest

    steps:
      - name: Check hostname
        run: hostname

  job3:
    name: JOB3
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Runs with single dependency
        run: sleep 10

  job4:
    name: JOB4
    needs: [job1, job2, job3]
    runs-on: ubuntu-latest

    steps:
      - name: Runs with multiple dependencies
        run: sleep 20
